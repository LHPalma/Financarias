name: External contracts

# Os testes de Financarias.Integrations.IntegrationTests batem nos provedores reais
# (ViaCEP, planilha de feriados da Anbima). Não servem de gate de push: uma queda do
# fornecedor reprovaria um commit correto. Mas o valor deles é justamente avisar quando
# o contrato externo muda — então rodam no schedule, e o vermelho aqui é informação real.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  external:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Test against the real providers
        run: dotnet test tests/Financarias.Integrations.IntegrationTests --configuration Release
